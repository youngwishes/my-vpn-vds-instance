[project]
name = "vpn-node-agent"
version = "0.1.0"
description = "Stateless VPN node management agent"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
