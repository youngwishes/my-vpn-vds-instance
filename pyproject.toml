[project]
name = "vpn-node-agent"
version = "0.1.0"
description = "Stateless VPN node management agent"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", "deploy/tests"]
