---
- name: Deploy VPN node
  hosts: vpn
  become: true
  vars:
    vpn_repository_url: https://github.com/youngwishes/my-vpn-vds-instance.git
    vpn_repository_version: main
    vpn_vless_enabled_effective: "{{ vpn_vless_enabled | default(true) | bool }}"
    vpn_deploy_root: /opt/vpn-node
    vpn_backend_url_effective: "{{ vpn_backend_url | default('https://beatvault.ru') }}"
    vpn_agent_bind_address_effective: >-
      {{ vpn_agent_bind_address | default('0.0.0.0') }}
    vpn_management_port_effective: "{{ vpn_management_port | default(8443) }}"
    vpn_swap_size_mb_effective: "{{ vpn_swap_size_mb | default(2048) | int }}"
    vpn_reality_target_effective: >-
      {{ vpn_reality_target | default('mtprotokeys.com:443') }}
    vpn_reality_server_name_effective: >-
      {{ vpn_reality_server_name | default('mtprotokeys.com') }}
    vpn_certbot_email_effective: "{{ vpn_certbot_email | default('') | trim }}"
    vpn_agent_token_file_effective: >-
      {{ vpn_agent_token_file | default(playbook_dir ~ '/secrets/vpn-agent-token') }}
    vpn_public_ipv4_effective: "{{ vpn_public_ipv4 | default(ansible_host) }}"
    vpn_hysteria_domain_effective: >-
      {{
        vpn_hysteria_domain
        | default((vpn_public_ipv4 | default(ansible_host)) | replace('.', '-') ~ '.sslip.io')
      }}
    vpn_xray_image: >-
      ghcr.io/xtls/xray-core@sha256:a1644183accdb0b5be967093fe34be756fd5de15fe2ee0206e842ae17350967f

  tasks:
    - name: Check the shared agent token on the controller
      ansible.builtin.stat:
        path: "{{ vpn_agent_token_file_effective }}"
      become: false
      delegate_to: localhost
      register: vpn_agent_token_file_stat

    - name: Validate deployment inputs
      ansible.builtin.assert:
        that:
          - vpn_agent_token_file_stat.stat.isreg | default(false)
          - vpn_backend_url_effective | length > 0
          - vpn_reality_target_effective | length > 0
          - vpn_reality_server_name_effective | length > 0
          - (vpn_management_port_effective | int) > 0
          - (vpn_management_port_effective | int) < 65536
          - (vpn_swap_size_mb_effective | int) > 0
        fail_msg: >-
          Create deploy/secrets/vpn-agent-token and configure any public
          overrides in inventory before deployment.

    - name: Validate the shared agent token is not empty
      ansible.builtin.assert:
        that:
          - >-
            (
              lookup(
                'ansible.builtin.file',
                vpn_agent_token_file_effective,
                errors='ignore'
              )
              | default('', true)
              | trim
              | length
            ) > 0
        quiet: true
        fail_msg: deploy/secrets/vpn-agent-token must not be empty.
      no_log: true

    - name: Validate the public IPv4 address
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import ipaddress
            import sys

            address = ipaddress.ip_address(sys.argv[1])
            if address.version != 4 or not address.is_global:
                raise ValueError("vpn_public_ipv4 must be a public IPv4 address")
          - "{{ vpn_public_ipv4_effective }}"
      changed_when: false

    - name: Install Git, OpenSSL and Certbot
      ansible.builtin.apt:
        name:
          - certbot
          - git
          - openssl
        state: present
        update_cache: true

    - name: Configure swap when none is active
      when: ansible_swaptotal_mb | int == 0
      block:
        - name: Check whether /swapfile already exists
          ansible.builtin.stat:
            path: /swapfile
            follow: false
          register: vpn_swapfile_stat

        - name: Refuse an unsafe existing /swapfile path
          ansible.builtin.assert:
            that:
              - >-
                not vpn_swapfile_stat.stat.exists
                or (
                  vpn_swapfile_stat.stat.isreg | default(false)
                  and not (vpn_swapfile_stat.stat.islnk | default(false))
                )
            fail_msg: >-
              /swapfile exists but is not a regular non-symlink file;
              refusing to modify it.

        - name: Inspect the existing /swapfile signature
          ansible.builtin.command:
            argv:
              - blkid
              - -p
              - -s
              - TYPE
              - -o
              - value
              - /swapfile
          register: vpn_swapfile_type
          changed_when: false
          failed_when: false
          when:
            - vpn_swapfile_stat.stat.exists
            - vpn_swapfile_stat.stat.isreg | default(false)
            - not (vpn_swapfile_stat.stat.islnk | default(false))

        - name: Refuse to overwrite a non-swap /swapfile
          ansible.builtin.assert:
            that:
              - >-
                not vpn_swapfile_stat.stat.exists
                or (vpn_swapfile_type.stdout | default('') | trim) == 'swap'
            fail_msg: >-
              /swapfile already exists but is not initialized as swap;
              refusing to overwrite it.

        - name: Prepare a new swap file
          when: not vpn_swapfile_stat.stat.exists
          block:
            - name: Create a unique staged swap file
              ansible.builtin.tempfile:
                state: file
                path: /
                prefix: .vpn-node-swapfile.
              register: vpn_swapfile_staging

            - name: Allocate the staged swap file
              ansible.builtin.command:
                argv:
                  - fallocate
                  - -l
                  - "{{ vpn_swap_size_mb_effective }}M"
                  - "{{ vpn_swapfile_staging.path }}"

            - name: Restrict staged swap file permissions
              ansible.builtin.file:
                path: "{{ vpn_swapfile_staging.path }}"
                owner: root
                group: root
                mode: "0600"

            - name: Initialize the staged swap file
              ansible.builtin.command:
                argv:
                  - mkswap
                  - "{{ vpn_swapfile_staging.path }}"

            - name: Publish the swap file atomically without overwriting
              ansible.builtin.command:
                argv:
                  - ln
                  - -T
                  - "{{ vpn_swapfile_staging.path }}"
                  - /swapfile
          always:
            - name: Remove the managed swap staging file
              ansible.builtin.file:
                path: "{{ vpn_swapfile_staging.path }}"
                state: absent
              when: vpn_swapfile_staging.path is defined

        - name: Restrict swap file permissions
          ansible.builtin.file:
            path: /swapfile
            owner: root
            group: root
            mode: "0600"

        - name: Activate the swap file
          ansible.builtin.command: swapon /swapfile

    - name: Inspect active swap paths
      ansible.builtin.command: swapon --show=NAME --noheadings --raw
      register: vpn_active_swap_paths
      changed_when: false

    - name: Persist the swap file
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: '^\s*/swapfile\s+'
        line: /swapfile none swap sw 0 0
        state: present
      when:
        - ansible_swaptotal_mb | int == 0
        - "'/swapfile' in vpn_active_swap_paths.stdout_lines"

    - name: Check whether Docker engine is available
      ansible.builtin.command: docker --version
      register: vpn_docker_engine_check
      changed_when: false
      failed_when: false

    - name: Install Docker engine when unavailable
      ansible.builtin.apt:
        name: docker.io
        state: present
      when: vpn_docker_engine_check.rc != 0

    - name: Check whether Docker Compose is available
      ansible.builtin.command: docker compose version
      register: vpn_docker_compose_check
      changed_when: false
      failed_when: false

    - name: Install Docker Compose when unavailable
      ansible.builtin.apt:
        name: docker-compose-v2
        state: present
      when: vpn_docker_compose_check.rc != 0

    - name: Ensure Docker is running
      ansible.builtin.systemd_service:
        name: docker.service
        enabled: true
        state: started

    - name: Clone or update repository from GitHub
      ansible.builtin.git:
        repo: "{{ vpn_repository_url }}"
        dest: "{{ vpn_deploy_root }}"
        version: "{{ vpn_repository_version }}"
        force: true

    - name: Enable Hysteria-only Compose configuration
      ansible.builtin.copy:
        src: "{{ vpn_deploy_root }}/docker-compose.hysteria-only.yml"
        dest: "{{ vpn_deploy_root }}/docker-compose.override.yml"
        remote_src: true
        owner: root
        group: root
        mode: "0644"
      when: not (vpn_vless_enabled_effective | bool)

    - name: Restore dual-protocol Compose configuration
      ansible.builtin.file:
        path: "{{ vpn_deploy_root }}/docker-compose.override.yml"
        state: absent
      when: vpn_vless_enabled_effective | bool

    - name: Remove the existing Xray container on Hysteria-only nodes
      ansible.builtin.command: docker compose --profile disabled rm --stop --force xray
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: true
      when: not (vpn_vless_enabled_effective | bool)

    - name: Create private runtime directory
      ansible.builtin.file:
        path: "{{ vpn_deploy_root }}/secrets"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Install the shared management token
      ansible.builtin.copy:
        src: "{{ vpn_agent_token_file_effective }}"
        dest: "{{ vpn_deploy_root }}/secrets/vpn-agent-token"
        owner: "65532"
        group: "65532"
        mode: "0400"
      no_log: true

    - name: Generate or adopt persistent node-specific transport material
      ansible.builtin.command:
        argv:
          - env
          - "VPN_SECRETS_DIR={{ vpn_deploy_root }}/secrets"
          - "XRAY_IMAGE={{ vpn_xray_image }}"
          - "{{ vpn_deploy_root }}/deploy/files/generate-node-secrets"
        creates: "{{ vpn_deploy_root }}/secrets/node-secrets.json"
      no_log: true

    - name: Read persistent node-specific transport material
      ansible.builtin.slurp:
        src: "{{ vpn_deploy_root }}/secrets/node-secrets.json"
      register: vpn_node_secret_file
      no_log: true

    - name: Decode persistent node-specific transport material
      ansible.builtin.set_fact:
        vpn_node_secrets: "{{ vpn_node_secret_file.content | b64decode | from_json }}"
      no_log: true

    - name: Validate generated transport material
      ansible.builtin.assert:
        that:
          - vpn_node_secrets.reality_private_key is string
          - vpn_node_secrets.reality_private_key | length > 0
          - vpn_node_secrets.reality_public_key is string
          - vpn_node_secrets.reality_public_key | length > 0
          - vpn_node_secrets.reality_short_id is string
          - vpn_node_secrets.reality_short_id | length <= 16
          - (vpn_node_secrets.reality_short_id | length) % 2 == 0
          - >-
            (
              vpn_node_secrets.reality_short_id
              | regex_replace('[0-9a-fA-F]', '')
              | length
            ) == 0
          - vpn_node_secrets.hysteria_obfs is string
          - vpn_node_secrets.hysteria_obfs | length > 0
        quiet: true
      no_log: true

    - name: Verify the sslip.io hostname resolves to this node
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import socket
            import sys

            addresses = {
                item[4][0]
                for item in socket.getaddrinfo(
                    sys.argv[1], None, family=socket.AF_INET
                )
            }
            if sys.argv[2] not in addresses:
                raise RuntimeError(
                    f"{sys.argv[1]} resolves to {sorted(addresses)}, not {sys.argv[2]}"
                )
          - "{{ vpn_hysteria_domain_effective }}"
          - "{{ vpn_public_ipv4_effective }}"
      changed_when: false

    - name: Request the Hysteria certificate with renewal email
      ansible.builtin.command:
        cmd: >-
          certbot certonly --standalone --non-interactive --agree-tos
          --keep-until-expiring --cert-name {{ vpn_hysteria_domain_effective }}
          --email {{ vpn_certbot_email_effective }}
          -d {{ vpn_hysteria_domain_effective }}
      when: vpn_certbot_email_effective | length > 0

    - name: Request the Hysteria certificate without renewal email
      ansible.builtin.command:
        cmd: >-
          certbot certonly --standalone --non-interactive --agree-tos
          --keep-until-expiring --register-unsafely-without-email
          --cert-name {{ vpn_hysteria_domain_effective }}
          -d {{ vpn_hysteria_domain_effective }}
      when: vpn_certbot_email_effective | length == 0

    - name: Install the current Hysteria certificate
      ansible.builtin.copy:
        src: >-
          /etc/letsencrypt/live/{{ vpn_hysteria_domain_effective }}/fullchain.pem
        dest: "{{ vpn_deploy_root }}/secrets/hysteria-tls.crt"
        remote_src: true
        owner: root
        group: root
        mode: "0400"

    - name: Install the current Hysteria private key
      ansible.builtin.copy:
        src: >-
          /etc/letsencrypt/live/{{ vpn_hysteria_domain_effective }}/privkey.pem
        dest: "{{ vpn_deploy_root }}/secrets/hysteria-tls.key"
        remote_src: true
        owner: root
        group: root
        mode: "0400"
      no_log: true

    - name: Scope the certificate renewal hook to this node certificate
      ansible.builtin.copy:
        dest: /etc/default/vpn-node-certificate
        content: |
          VPN_CERTIFICATE_LINEAGE=/etc/letsencrypt/live/{{ vpn_hysteria_domain_effective }}
          VPN_DEPLOY_ROOT={{ vpn_deploy_root }}
        owner: root
        group: root
        mode: "0644"

    - name: Install the Hysteria certificate renewal deploy hook
      ansible.builtin.copy:
        src: "{{ vpn_deploy_root }}/deploy/files/renew-hysteria-certificate"
        dest: /etc/letsencrypt/renewal-hooks/deploy/vpn-node-hysteria
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Ensure automatic certificate renewal is enabled
      ansible.builtin.systemd_service:
        name: certbot.timer
        enabled: true
        state: started

    - name: Read Xray template from the GitHub checkout
      ansible.builtin.slurp:
        src: "{{ vpn_deploy_root }}/xray/config.json"
      register: xray_template
      when: vpn_vless_enabled_effective | bool

    - name: Read Hysteria template from the GitHub checkout
      ansible.builtin.slurp:
        src: "{{ vpn_deploy_root }}/hysteria/config.yaml"
      register: hysteria_template

    - name: Write public runtime environment
      ansible.builtin.copy:
        dest: "{{ vpn_deploy_root }}/.env"
        content: |
          VPN_BACKEND_URL={{ vpn_backend_url_effective }}
          VPN_AGENT_BIND_ADDRESS={{ vpn_agent_bind_address_effective }}
          VPN_AGENT_MANAGEMENT_PORT={{ vpn_management_port_effective }}
        owner: root
        group: root
        mode: "0644"

    - name: Render transport configuration
      no_log: true
      block:
        - name: Render Xray REALITY configuration
          ansible.builtin.copy:
            dest: "{{ vpn_deploy_root }}/secrets/xray-config.json"
            content: >-
              {{
                xray_template.content | b64decode
                | replace('"__VPN_REALITY_TARGET__"', vpn_reality_target_effective | to_json)
                | replace('"__VPN_REALITY_SERVER_NAME__"', vpn_reality_server_name_effective | to_json)
                | replace('"__VPN_REALITY_PRIVATE_KEY__"', vpn_node_secrets.reality_private_key | to_json)
                | replace('"__VPN_REALITY_SHORT_ID__"', vpn_node_secrets.reality_short_id | to_json)
              }}
            owner: "65532"
            group: "65532"
            mode: "0400"
          register: vpn_xray_runtime_config
          when: vpn_vless_enabled_effective | bool

        - name: Render Hysteria obfuscation configuration
          ansible.builtin.copy:
            dest: "{{ vpn_deploy_root }}/secrets/hysteria-config.yaml"
            content: >-
              {{
                hysteria_template.content | b64decode
                | replace('"__VPN_HYSTERIA_OBFS__"', vpn_node_secrets.hysteria_obfs | to_json)
              }}
            owner: root
            group: root
            mode: "0400"

    - name: Pull pinned runtime images
      ansible.builtin.command: docker compose pull
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: true

    - name: Build agent from the GitHub checkout
      ansible.builtin.command: docker compose build --pull agent
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: true

    - name: Reload Xray and agent after REALITY configuration changes
      ansible.builtin.command: >-
        docker compose up -d --force-recreate xray agent
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: true
      when: vpn_xray_runtime_config.changed and (vpn_vless_enabled_effective | bool)

    - name: Apply runtime configuration
      ansible.builtin.command: docker compose up -d --remove-orphans
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: true

    - name: Reload management proxy after agent recreation
      ansible.builtin.command: docker compose exec -T management-proxy nginx -s reload
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: true

    - name: Wait for the node-agent health endpoint
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ vpn_management_port_effective }}/health"
        status_code: 200
      register: vpn_health
      retries: 12
      delay: 5
      until: vpn_health.status == 200

    - name: Verify Hysteria stays running
      ansible.builtin.command: >-
        docker compose ps --status running --services hysteria
      args:
        chdir: "{{ vpn_deploy_root }}"
      changed_when: false
      register: vpn_hysteria_status
      retries: 3
      delay: 5
      until: "'hysteria' in vpn_hysteria_status.stdout_lines"

    - name: Show values for the inactive backend VPNInstance
      ansible.builtin.debug:
        msg:
          management_url: >-
            http://{{ vpn_public_ipv4_effective }}:{{ vpn_management_port_effective }}
          public_host: "{{ vpn_hysteria_domain_effective }}"
          vless_enabled: "{{ vpn_vless_enabled_effective | bool }}"
          vless_port: 443
          reality_sni: "{{ vpn_reality_server_name_effective }}"
          reality_public_key: "{{ vpn_node_secrets.reality_public_key }}"
          reality_short_id: "{{ vpn_node_secrets.reality_short_id }}"
          hysteria_port: 443
          hysteria_sni: "{{ vpn_hysteria_domain_effective }}"
          hysteria_obfs: "{{ vpn_node_secrets.hysteria_obfs }}"
